<svg style="vertical-align: -4.362ex; min-width: 50.742ex;" xmlns="http://www.w3.org/2000/svg" width="80ex" height="9.855ex" role="img" focusable="false" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 78.84" aria-label="\begin{aligned}
\Gamma^\rho{}_{\mu\nu}
&amp;=\frac12 g^{\rho\lambda}
\left(\partial_\mu g_{\nu\lambda}
+\partial_\nu g_{\lambda\mu}
-\partial_\lambda g_{\mu\nu}\right)\\
&amp;=\frac12\eta^{\rho\lambda}
\left(\partial_\mu h_{\nu\lambda}
+\partial_\nu h_{\lambda\mu}
-\partial_\lambda h_{\mu\nu}\right).
\end{aligned}

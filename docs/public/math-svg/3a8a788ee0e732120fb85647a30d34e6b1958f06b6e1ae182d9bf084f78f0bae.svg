&amp;=-2\frac{1}{\sqrt{-g}}\frac{\delta S_\phi}{\delta g^{\mu\nu}}\\
&amp;=\nabla_\mu\phi\nabla_\nu\phi
-\frac12g_{\mu\nu}g^{\rho\sigma}
\nabla_\rho\phi\nabla_\sigma\phi
-g_{\mu\nu}V(\phi).
\end{aligned}

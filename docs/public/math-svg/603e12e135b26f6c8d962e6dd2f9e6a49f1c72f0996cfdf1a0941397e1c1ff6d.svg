\operatorname{Loss}(h_w)
&amp;=\frac12\sum_{j=1}^{N}L_2(y^j,h_w(x^j))\\
&amp;=\frac12\sum_{j=1}^{N}(y^j-h_w(x^j))^2\\
&amp;=\frac12\lVert y-Xw\rVert_2^2。
\end{aligned}

<svg style="vertical-align: -8.466ex; min-width: 49.4ex;" xmlns="http://www.w3.org/2000/svg" width="80ex" height="18.063ex" role="img" focusable="false" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 144.504" aria-label="\begin{aligned}
\Gamma^r{}_{\theta\theta}
&amp;=\frac12g^{r\rho}
 (\partial_\theta g_{\theta\rho}+\partial_\theta g_{\rho\theta}-\partial_\rho g_{\theta\theta})\\
&amp;=\frac12g^{rr}
 (\partial_\theta g_{\theta r}+\partial_\theta g_{r\theta}-\partial_r g_{\theta\theta})\\
&amp;=\frac12(1)(0+0-2r)\\
&amp;=-r.
\end{aligned}

<svg style="vertical-align: -3.839ex; min-width: 73.762ex;" xmlns="http://www.w3.org/2000/svg" width="80ex" height="8.808ex" role="img" focusable="false" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 70.464" aria-label="\begin{aligned}
\mathcal L(\Phi^i,\partial_\mu\Phi^i)
&amp;\longrightarrow
\mathcal L(\Phi^i+\delta\Phi^i,
\partial_\mu\Phi^i+\partial_\mu\delta\Phi^i)\\
&amp;=\mathcal L(\Phi^i,\partial_\mu\Phi^i)
+\frac{\partial\mathcal L}{\partial\Phi^i}\delta\Phi^i
+\frac{\partial\mathcal L}{\partial(\partial_\mu\Phi^i)}
\partial_\mu(\delta\Phi^i).
\end{aligned}
